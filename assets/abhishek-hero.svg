<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Abhishek Bagi — Backend and Applied AI Developer</title>
  <desc id="desc">A burgundy developer banner with subtle technical grid, orbital geometry and animated light.</desc>
  <defs>
    <linearGradient id="bg-abhishek" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset=".52" stop-color="#2A0D1B"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="shine-abhishek" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E5B5C7" stop-opacity=".75"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-abhishek" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow-abhishek" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-abhishek"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip-abhishek)">
    <rect width="1200" height="360" fill="url(#bg-abhishek)"/>
    <rect width="1200" height="360" fill="url(#grid-abhishek)"/>
    <circle cx="1010" cy="120" r="190" fill="none" stroke="#C77B9B" stroke-opacity=".18"/>
    <circle cx="1010" cy="120" r="145" fill="none" stroke="#C77B9B" stroke-opacity=".22" stroke-dasharray="3 10"/>
    <circle cx="1010" cy="120" r="92" fill="none" stroke="#E5B5C7" stroke-opacity=".16"/>
    <path d="M760 290 C850 220 880 310 970 225 S1090 90 1215 155" fill="none" stroke="#C77B9B" stroke-opacity=".48" stroke-width="2"/>
    <path d="M780 318 C870 248 900 338 990 253 S1110 118 1235 183" fill="none" stroke="#E5B5C7" stroke-opacity=".22" stroke-width="1"/>
    <circle cx="970" cy="225" r="5" fill="#E5B5C7" filter="url(#glow-abhishek)"/>
    <circle cx="1090" cy="90" r="4" fill="#C77B9B" filter="url(#glow-abhishek)"/>
    <rect x="-300" y="0" width="170" height="360" fill="url(#shine-abhishek)" opacity=".12" transform="skewX(-18)">
      <animate attributeName="x" values="-350;1400" dur="9s" repeatCount="indefinite"/>
    </rect>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="76" y="82" fill="#E5B5C7" font-size="14" letter-spacing="4">BUILDING WITH INTENT</text>
      <text x="72" y="164" fill="#F8F0F3" font-size="58" font-weight="700" letter-spacing="-2">ABHISHEK BAGI</text>
      <rect x="76" y="190" width="450" height="2" rx="1" fill="#C77B9B"/>
      <rect x="76" y="190" width="110" height="2" rx="1" fill="#F8F0F3" filter="url(#glow-abhishek)">
        <animate attributeName="x" values="76;416;76" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="76" y="232" fill="#F8F0F3" font-size="19" letter-spacing="2">BACKEND DEVELOPMENT  /  APPLIED AI</text>
      <text x="76" y="276" fill="#C77B9B" font-size="15" letter-spacing="1.5">INFORMATION SCIENCE &amp; ENGINEERING · BENGALURU, INDIA</text>
      <text x="76" y="322" fill="#E5B5C7" fill-opacity=".65" font-size="12" letter-spacing="2">IDEA → PROTOTYPE → TEST → SHIP</text>
    </g>
    <text x="1120" y="325" text-anchor="end" fill="#E5B5C7" fill-opacity=".45" font-family="monospace" font-size="11">AB / 2026</text>
  </g>
</svg>